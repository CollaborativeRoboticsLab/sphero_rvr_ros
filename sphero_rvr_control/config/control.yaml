/**:
  ros__parameters:
    update_rate: 10

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # override the ros2_control hardware settings provided in urdf
    hardware:
      simulated: false # set to true to use a simulated RVR hardware interface
      # Production default: Raspberry Pi primary UART alias
      device_port: "/dev/serial0"
      baud_rate: 115200
      # Encoder calibration
      ticks_per_revolution: 4096
      # Velocity scaling used when mapping wheel rad/s to raw duty
      max_wheel_velocity_rad_s: 10.0
