# Docker Compose configuration for pi based deployment of RVR with serial device access
version: "3.8"
services:
  rvr_deployment:
    build:
      context: ..
      dockerfile: dockerfile
    command: >
      ros2 launch sphero_rvr_bringup sphero_rvr_bringup.launch
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - ROS_DISCOVERY_SERVER=${DISCOVERY_SERVER_IP:-127.0.0.1}:${DISCOVERY_SERVER_PORT:-11811}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - ROS_AUTOMATIC_DISCOVERY_RANGE=${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      - ROS_SUPER_CLIENT=True
      - SERIAL_PORT=${SERIAL_PORT:-/dev/serial0}
      - I2C_BUS=${I2C_BUS:-/dev/i2c-1}
      - MQTT_BROKER=${MQTT_BROKER:-localhost}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-fleet/rvr}
      - ROBOT_ID=${ROBOT_ID:-rvr-001}
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
    devices:
      - "/dev/serial0:/dev/serial0"
    group_add:
      - dialout

  # fast RTPS discovery server
  discovery_server:
    image: ros:jazzy-ros-core
    command: >
      fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISCOVERY_SERVER_PORT=${DISCOVERY_SERVER_PORT:-11811}
      - ROS_DISCOVERY_SERVER=${DISCOVERY_SERVER_IP:-0.0.0.0}:${DISCOVERY_SERVER_PORT:-11811}
      - ROS_LOCALHOST_ONLY=0
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
    restart: unless-stopped
    network_mode: host

  # mqtt broker
  mqtt_broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT default port
