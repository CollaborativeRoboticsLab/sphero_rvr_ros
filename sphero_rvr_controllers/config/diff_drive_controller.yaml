diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      ["left_track_front_wheel_joint", "left_track_back_wheel_joint"]
    right_wheel_names:
      ["right_track_front_wheel_joint", "right_track_back_wheel_joint"]

    wheel_separation: 0.14
    wheel_radius: 0.0325
    wheel_separation_multiplier: 1.5

    publish_rate: 10.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 10000.0, 10000.0, 10000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 10000.0, 10000.0, 0.03]
    open_loop: false
    enable_odom_tf: false # Set true if you want controller to publish odom->base_link TF

    cmd_vel_timeout: 0.15

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 6.0
    angular.z.min_velocity: -6.0
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0
